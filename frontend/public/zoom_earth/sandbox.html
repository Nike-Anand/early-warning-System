<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Earth - Sandbox Clone</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }

        aside.panel.weather.daily.notranslate {
            display: none;
        }
    </style>
</head>

<body>
    <!-- The sandbox attribute explicitly blocks 'allow-top-navigation', trapping redirects -->
    <iframe sandbox="allow-scripts allow-same-origin" src="index.html"></iframe>
</body>

</html>
