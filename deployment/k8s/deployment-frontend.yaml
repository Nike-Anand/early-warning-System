apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdoner-command-dashboard
  namespace: mdoner-disaster-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mdoner-frontend
  template:
    metadata:
      labels:
        app: mdoner-frontend
    spec:
      containers:
        - name: frontend
          image: mdoner-command-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mdoner-disaster-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: mdoner-frontend
