apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mdoner-ingress
  namespace: mdoner-disaster-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - landslide-warning.mdoner.gov.in
      secretName: mdoner-tls-certs
  rules:
    - host: landslide-warning.mdoner.gov.in
      http:
        paths:
          # Route Backend REST APIs
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Route Real-Time WebSockets
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Route Frontend Command Dashboard
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
