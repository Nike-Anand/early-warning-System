apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdoner-predictive-engine
  namespace: mdoner-disaster-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mdoner-backend
  template:
    metadata:
      labels:
        app: mdoner-backend
    spec:
      containers:
        - name: backend
          image: mdoner-predictive-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres_secure_password_sih26001@postgis-service:5432/mdoner_gis"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: SMS_DLT_SENDER_ID
              value: "MDONER"
            - name: SMS_DLT_TEMPLATE_ID
              value: "1407161829000123"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: mdoner-disaster-system
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: mdoner-backend
---
# Horizontal Pod Autoscaler (HPA) for High Monsoon Downpour Traffic Spikes
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: mdoner-disaster-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mdoner-predictive-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
