apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdoner-redis
  namespace: mdoner-disaster-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdoner-redis
  template:
    metadata:
      labels:
        app: mdoner-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: mdoner-disaster-system
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: mdoner-redis
