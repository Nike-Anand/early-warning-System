# ==============================================================================
# SIH ID 26001: Eclipse Mosquitto MQTT Broker Configuration Profile
# ==============================================================================

# Standard unencrypted TCP/UDP listening port for low-power edge nodes
listener 1883 0.0.0.0

# Allow anonymous connections for field IoT sensor telemetry streams
allow_anonymous true

# Enable disk persistence for guaranteed message queue delivery
persistence true
persistence_location /mosquitto/data/

# Output logging to standard output for Docker log integration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
