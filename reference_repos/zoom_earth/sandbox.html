<!DOCTYPE html>
<html>
<head>
    <title>Zoom Earth - Sandboxed Clone with Custom Markers</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        #map-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #marker-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the map */
            z-index: 2; /* Sit on top of the iframe */
        }
        .custom-marker {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid white;
            /* Center the dot on the exact x/y pixel */
            margin-top: -8px; 
            margin-left: -8px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto; /* Allow hovering the marker itself */
            cursor: pointer;
            transition: transform 0.05s linear; /* Smooth micro-stutters */
        }
        .custom-marker-label {
            position: absolute;
            left: 24px;
            white-space: nowrap;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .custom-marker:hover .custom-marker-label {
            opacity: 1;
        }
    </style>
</head>
<body>
    <iframe id="map-frame" src="index.html" sandbox="allow-scripts allow-same-origin"></iframe>
    <div id="marker-overlay"></div>
    <script src="assets/js/custom_markers.js"></script>
</body>
</html>
